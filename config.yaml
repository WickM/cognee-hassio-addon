name: Cognee
version: "0.4.1"
slug: cognee
description: Cognee graph memory + retrieval API (sidecar to OpenClaw / any agent)
url: https://github.com/WickM/cognee-hassio-addon
webui: "[PROTO:http]://[HOST]:[PORT:8000]"
arch:
  - amd64
init: false
startup: services
map:
  - share:rw
  - ssl
backup: hot
backup_exclude:
  - "**/logs"
  - "**/cache"
schema:
  # API keys — optional when graph_extractor=gliner (no LLM needed)
  llm_api_key: password?
  embedding_api_key: password?

  # LLM (graph extraction, etc.) — optional when graph_extractor=gliner
  llm_provider: str?
  llm_model: str?
  llm_base_url: str?

  # Graph extractor — controls entity/relation extraction backend
  # - auto: use LLM if configured, else fall back to GLiNER2
  # - gliner_demo: force GLiNER2 (no LLM needed for extraction)
  # - llm: force LLM-based extraction (fails if LLM not configured)
  graph_extractor: str?
  # v0.4.1: GLINER_AUTO_INSTALL — when false, cognee will NOT try to
  # pip-install gliner2/torch at runtime (they're pre-installed in the
  # Docker image). Set to true only if you want cognee to self-install
  # the GLiNER2 runtime on first use.
  gliner_auto_install: bool?

  # Embeddings
  embedding_provider: str
  embedding_model: str
  # v0.2.3: no default. HA-UI auto-fills `int?` with 0 if left empty,
  # which causes Voyage 4-large to reject `output_dimension=0` (HTTP 422).
  # If users want a value, they set it explicitly; else leave the field
  # blank in HA-UI (after the empty-save quirk is fixed upstream).
  embedding_dimensions: int?
  # v0.2.0: `embedding_endpoint` is the cognee-1.x variable name. Optional;
  # when `embedding_provider=openai_compatible`, this is REQUIRED (cognee
  # does NOT fall back to `embedding_base_url` for `openai_compatible`).
  # `embedding_base_url` is kept for backwards-compat with v0.1.x configs
  # and with the `openai` provider (which does fall back to it).
  embedding_endpoint: str?
  embedding_base_url: str?

  # v0.2.3: instructor mode override. Cognee defaults to `json_mode` for
  # the `generic` adapter, which sends `response_format: {type: json_object}`
  # to the LLM. Kilo's BYOK MiniMax routing strips that — HTTP 400
  # `Invalid input param: response_format`. `md_json` parses JSON from
  # Markdown code-blocks instead, with no `response_format` involved.
  # Leave empty to use cognee's default.
  llm_instructor_mode: str?

  # Addon behavior
  cognee_port: int
  agent_mode: bool
  log_level: str
  data_path: str
  # v0.3.1: MCP server — when enabled, the addon exposes a Model Context
  # Protocol SSE endpoint on port 8000 alongside cognee's REST API.
  # SSE at /sse + /messages/. Compatible with OpenClaw, Cline, Kilo.
  enable_mcp: bool

options:
  llm_api_key: ""
  embedding_api_key: ""

  # v0.2.3 defaults: kilocode gateway + MiniMax-M3 (LLM) + Voyage-4-large (embeddings).
  # `embedding_dimensions` is intentionally NOT in `options:` — HA-UI auto-fills
  # `int?` fields with `0` if they're missing, which makes Voyage reject `dim=0`.
  # LLM fields default to the kilocode gateway; clear them in HA-UI to use
  # GLiNER2 for graph extraction (no LLM API key needed).
  llm_provider: custom
  llm_model: minimax/minimax-m3
  llm_base_url: https://api.kilo.ai/api/gateway/v1
  llm_instructor_mode: MD_JSON

  # Graph extractor: auto | gliner_demo | llm
  # auto (default) = use LLM if configured, else GLiNER2
  graph_extractor: auto

  embedding_provider: voyageai
  embedding_model: voyage/voyage-4-large
  embedding_endpoint: https://api.voyageai.com/v1
  # No `embedding_dimensions:` key here. Add explicitly in HA-UI if you
  # want a non-default value (Voyage 4-large accepts 256/512/1024/2048;
  # default is 1024).

  cognee_port: 8000
  agent_mode: true
  log_level: INFO
  data_path: /share/cognee
  enable_mcp: true

ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: Cognee REST API + Web UI + MCP SSE (/sse, /messages/)

image: ghcr.io/wickm/cognee-hassio-addon