name: Cognee
version: "0.2.1"
slug: cognee
description: Cognee graph memory + retrieval API (sidecar to OpenClaw / any agent)
url: https://github.com/WickM/cognee-hassio-addon
webui: "[PROTO:http]://[HOST]:[PORT:8000]"
arch:
  - amd64
init: false
startup: services
map:
  - share:rw
  - ssl
backup: hot
backup_exclude:
  - "**/logs"
  - "**/cache"
schema:
  # API keys — entered in HA UI, never committed
  llm_api_key: password
  embedding_api_key: password?

  # LLM (graph extraction, etc.)
  llm_provider: str
  llm_model: str
  llm_base_url: str?

  # Embeddings
  embedding_provider: str
  embedding_model: str
  embedding_dimensions: int?
  # v0.2.0: `embedding_endpoint` is the cognee-1.x variable name. Optional;
  # when `embedding_provider=openai_compatible`, this is REQUIRED (cognee
  # does NOT fall back to `embedding_base_url` for `openai_compatible`).
  # `embedding_base_url` is kept for backwards-compat with v0.1.x configs
  # and with the `openai` provider (which does fall back to it).
  embedding_endpoint: str?
  embedding_base_url: str?

  # Addon behavior
  cognee_port: int
  agent_mode: bool
  log_level: str
  data_path: str

options:
  llm_api_key: ""
  embedding_api_key: ""

  # Defaults: kilocode gateway with MiniMax + openai embeddings
  llm_provider: openai
  llm_model: minimax/minimax-m3
  llm_base_url: https://api.kilo.ai/api/gateway/v1

  embedding_provider: openai
  embedding_model: text-embedding-3-small
  embedding_dimensions: 1536
  embedding_base_url: https://api.kilo.ai/api/gateway/v1

  cognee_port: 8000
  agent_mode: true
  log_level: INFO
  data_path: /share/cognee

ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: Cognee API + Web UI

image: ghcr.io/wickm/cognee-hassio-addon