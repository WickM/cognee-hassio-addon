name: Build and Push Cognee Add-on Image

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

# Serialize concurrent runs to avoid hammering GitHub's runner pool.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    # ubuntu-22.04 is an explicit pinned image; on GitHub's free tier the
    # 'latest' label is sometimes starved for hosted runners — pinning a
    # specific image pulls from a different pool allocation.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install yq (for config.yaml version extraction)
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.40.5/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Extract version from config.yaml
        id: version
        run: |
          VERSION=$(yq '.version' config.yaml)
          echo "v=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cognee-hassio-addon
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.v }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.v }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
            BUILD_DESCRIPTION=Cognee graph memory API for Home Assistant
            BUILD_NAME=Cognee
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
